<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framer Motion - Ultimate Showcase (101 Examples)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 200px;
      background: rgba(15, 15, 20, 0.98);
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 20px 0;
      overflow-y: auto;
      z-index: 1000;
    }
    .sidebar h1 {
      font-size: 0.9rem;
      padding: 0 20px 20px;
      color: #667eea;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 15px;
    }
    .sidebar-section {
      padding: 10px 20px 5px;
      font-size: 0.7rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sidebar button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: #666;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .sidebar button:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .sidebar button.active {
      color: #667eea;
      background: rgba(102, 126, 234, 0.1);
      border-left: 2px solid #667eea;
    }

    /* Main Content */
    .main-content {
      margin-left: 200px;
      padding: 40px;
      min-height: 100vh;
    }
    .demo-header {
      margin-bottom: 40px;
    }
    .demo-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .demo-subtitle {
      color: #666;
      font-size: 1rem;
      max-width: 600px;
      line-height: 1.6;
    }
    .demo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      gap: 30px;
    }
    .demo-scroll {
      min-height: auto;
    }
    .replay-btn {
      padding: 12px 30px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .replay-btn:hover { background: rgba(255,255,255,0.15); }
    .primary-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    /* ========== COMPONENT STYLES ========== */

    /* Basic Box */
    .box {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      cursor: pointer;
    }

    /* App Store Cards */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .app-card {
      height: 180px;
      border-radius: 20px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }
    .app-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .app-card-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
    }
    .app-card h3 { font-size: 1.1rem; margin-bottom: 4px; }
    .app-card p { font-size: 0.75rem; color: #aaa; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .modal-card {
      width: 100%;
      max-width: 700px;
      background: #151520;
      border-radius: 24px;
      overflow: hidden;
    }
    .modal-image { height: 280px; position: relative; }
    .modal-image img { width: 100%; height: 100%; object-fit: cover; }
    .modal-body { padding: 30px; }
    .modal-body h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .modal-body .tag { color: #667eea; font-size: 0.8rem; margin-bottom: 15px; }
    .modal-body .desc { color: #888; line-height: 1.7; font-size: 0.9rem; }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* 3D Card */
    .card-3d-wrap { perspective: 1000px; }
    .card-3d {
      width: 300px;
      height: 380px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 30px;
      transform-style: preserve-3d;
      cursor: pointer;
      position: relative;
    }
    .card-3d-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 18px;
      margin-bottom: 25px;
    }
    .card-3d h3 { font-size: 1.4rem; margin-bottom: 12px; }
    .card-3d p { color: #888; line-height: 1.6; font-size: 0.9rem; }

    /* SVG Morph */
    .morph-wrap { display: flex; flex-direction: column; align-items: center; gap: 25px; }
    .morph-svg { width: 280px; height: 280px; }
    .morph-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .morph-btns button {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .morph-btns button.active { background: linear-gradient(135deg, #667eea, #764ba2); }

    /* Reorder List */
    .reorder-wrap { max-width: 450px; width: 100%; }
    .reorder-item {
      background: rgba(102, 126, 234, 0.15);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .reorder-item:active { cursor: grabbing; }
    .reorder-item .handle { color: #555; }
    .reorder-item h4 { flex: 1; font-size: 0.9rem; }
    .reorder-item span { color: #667eea; font-size: 0.75rem; }

    /* Gesture Unlock */
    .gesture-track {
      width: 280px;
      height: 56px;
      background: rgba(255,255,255,0.1);
      border-radius: 28px;
      position: relative;
    }
    .gesture-track::after {
      content: 'Slide to unlock';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.85rem;
    }
    .gesture-thumb {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      position: absolute;
      left: 5px;
      top: 5px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      font-size: 1.1rem;
    }

    /* Particles */
    .particles-area {
      position: relative;
      width: 100%;
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }
    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
    }
    .particles-text {
      font-size: 2.5rem;
      font-weight: 700;
      color: #333;
      z-index: 1;
    }

    /* Path Draw */
    .path-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .path-svg {
      width: 350px;
      height: 180px;
    }
    .path-svg path {
      fill: none;
      stroke: url(#pathGradient);
      stroke-width: 4;
      stroke-linecap: round;
    }

    /* Magnetic Button */
    .magnetic-btn {
      padding: 18px 45px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    /* Scramble */
    .scramble-text {
      font-size: 2.5rem;
      font-weight: 700;
      cursor: pointer;
      padding: 20px 35px;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 3px;
    }

    /* Cursor */
    .cursor-area {
      width: 100%;
      max-width: 600px;
      height: 350px;
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      cursor: none;
    }
    .cursor-dot {
      width: 16px;
      height: 16px;
      background: #667eea;
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
    }
    .cursor-ring {
      width: 45px;
      height: 45px;
      border: 2px solid rgba(102, 126, 234, 0.5);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
    }

    /* Aurora */
    .aurora-btn {
      padding: 16px 40px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: transparent;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Marquee */
    .marquee-wrap {
      width: 100%;
      overflow: hidden;
      padding: 30px 0;
    }
    .marquee-track {
      display: flex;
      gap: 50px;
      white-space: nowrap;
    }
    .marquee-item {
      font-size: 3.5rem;
      font-weight: 800;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.25);
    }
    .marquee-item.filled {
      -webkit-text-stroke: none;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
    }

    /* Text Reveal */
    .reveal-wrap {
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }
    .reveal-line {
      font-size: 2.8rem;
      font-weight: 700;
      overflow: hidden;
      position: relative;
    }

    /* Flip Text */
    .flip-wrap { display: flex; gap: 15px; }
    .flip-card {
      padding: 18px 35px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
    }
    .flip-card span {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Card Stack */
    .stack-wrap {
      position: relative;
      width: 260px;
      height: 340px;
    }
    .stack-card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      cursor: grab;
    }
    .stack-card:active { cursor: grabbing; }

    /* Blob */
    .blob-wrap {
      width: 260px;
      height: 260px;
      cursor: pointer;
    }
    .blob-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 25px rgba(102, 126, 234, 0.4));
    }

    /* Typewriter */
    .typewriter-text {
      font-size: 1.8rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #667eea;
    }
    .typewriter-cursor {
      display: inline-block;
      width: 3px;
      height: 1.1em;
      background: #667eea;
      margin-left: 3px;
      vertical-align: text-bottom;
    }

    /* Parallax */
    .parallax-container { height: 300vh; }
    .parallax-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .parallax-layer {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .parallax-circle {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    /* Counter */
    .counter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 35px;
    }
    .counter-item { text-align: center; }
    .counter-value {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .counter-label {
      color: #666;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    /* Stagger Grid */
    .stagger-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 12px;
    }
    .stagger-item {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 10px;
    }

    /* H-Scroll */
    .hscroll-container { height: 300vh; }
    .hscroll-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .hscroll-track {
      display: flex;
      gap: 25px;
      padding: 0 40px;
    }
    .hscroll-card {
      flex-shrink: 0;
      width: 350px;
      height: 450px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(118, 75, 162, 0.15));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hscroll-card .num { font-size: 3.5rem; opacity: 0.15; margin-bottom: auto; }
    .hscroll-card h3 { font-size: 1.6rem; margin-bottom: 10px; }
    .hscroll-card p { color: #888; line-height: 1.6; font-size: 0.9rem; }

    /* Notifications */
    .notif-wrap { max-width: 380px; width: 100%; }
    .notif-item {
      background: linear-gradient(135deg, #151520, #1a1a2e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }
    .notif-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .notif-content h4 { font-size: 0.9rem; margin-bottom: 3px; }
    .notif-content p { font-size: 0.75rem; color: #666; }

    /* Accordion */
    .accordion-wrap { max-width: 550px; width: 100%; }
    .accordion-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .accordion-header {
      padding: 18px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .accordion-header h4 { font-size: 0.95rem; }
    .accordion-content {
      padding: 0 18px;
      color: #888;
      line-height: 1.7;
      font-size: 0.9rem;
      overflow: hidden;
    }

    /* Advanced Parallax Hero */
    .hero-parallax {
      height: 400vh;
      position: relative;
    }
    .hero-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a0f 70%);
    }
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(102, 126, 234, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102, 126, 234, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
    }
    .hero-title {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 20px;
    }
    .hero-sub {
      font-size: 1.4rem;
      color: #888;
    }
    .floating-card {
      position: absolute;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
    }

    /* Image Reveal */
    .image-reveal-wrap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 800px;
    }
    .image-reveal-item {
      aspect-ratio: 4/5;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .image-reveal-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Text Split */
    .split-text {
      font-size: 4rem;
      font-weight: 800;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 15px;
    }
    .split-word {
      display: flex;
      overflow: hidden;
    }
    .split-char {
      display: inline-block;
    }

    /* Elastic Button */
    .elastic-btn {
      padding: 20px 50px;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 60px;
      color: #fff;
      cursor: pointer;
      position: relative;
    }

    /* Floating Action */
    .fab-wrap {
      position: relative;
      width: 60px;
      height: 60px;
    }
    .fab-main {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }
    .fab-item {
      position: absolute;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* Progress Ring */
    .progress-ring {
      width: 200px;
      height: 200px;
    }
    .progress-ring circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .progress-ring .bg { stroke: rgba(255,255,255,0.1); }
    .progress-ring .fg { stroke: url(#progressGradient); }
    .progress-value {
      font-size: 3rem;
      font-weight: 700;
    }

    /* Tabs */
    .tabs-wrap { width: 100%; max-width: 500px; }
    .tabs-header {
      display: flex;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 5px;
      position: relative;
      margin-bottom: 20px;
    }
    .tabs-header button {
      flex: 1;
      background: transparent;
      border: none;
      color: #888;
      padding: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }
    .tabs-header button.active { color: #fff; }
    .tabs-indicator {
      position: absolute;
      top: 5px;
      bottom: 5px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 8px;
    }
    .tabs-content {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 25px;
      min-height: 150px;
    }

    /* Skeleton */
    .skeleton-wrap {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 20px;
    }
    .skeleton-item {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      border-radius: 8px;
    }
    .skeleton-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    .skeleton-line {
      height: 12px;
      margin-bottom: 10px;
    }

    /* Drag Grid */
    .drag-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 400px;
    }
    .drag-item {
      aspect-ratio: 1;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: grab;
    }
    .drag-item:active { cursor: grabbing; }

    /* macOS Dock */
    .dock-container {
      display: flex;
      align-items: flex-end;
      gap: 8px;

    // Text Scramble
    function ScrambleDemo() {
      const TARGET = "FRAMER MOTION";
      const CHARS = "!@#$%^&*()ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const [text, setText] = React.useState(TARGET);
      const intervalRef = React.useRef(null);

      const scramble = () => {
        let pos = 0;
        intervalRef.current = setInterval(() => {
          setText(TARGET.split('').map((c, i) => {
            if (c === ' ') return ' ';
            if (pos / 2 > i) return TARGET[i];
            return CHARS[Math.floor(Math.random() * CHARS.length)];
          }).join(''));
          pos++;
          if (pos >= TARGET.length * 2) {
            clearInterval(intervalRef.current);
            setText(TARGET);
          }
        }, 40);
      };

      const stop = () => { clearInterval(intervalRef.current); setText(TARGET); };

      return (
        <>
          <h2 className="demo-title">Text Scramble</h2>
          <p className="demo-subtitle">Matrix-style character scrambling on hover. Interval-based animation with random characters.</p>
          <div className="demo-area">
            <motion.div
              className="scramble-text"
              onMouseEnter={scramble}
              onMouseLeave={stop}
              whileHover={{ scale: 1.02 }}
            >
              {text}
            </motion.div>
          </div>
        </>
      );
    }

        return (

            className="dock-item"

    // 41. Velocity Scroll Text
    function VelocityScrollDemo() {
      const baseX = useMotionValue(0);
      const { scrollY } = useScroll();
      const scrollVelocity = useVelocity(scrollY);
      const smoothVelocity = useSpring(scrollVelocity, { damping: 50, stiffness: 400 });
      const velocityFactor = useTransform(smoothVelocity, [0, 1000], [0, 5], { clamp: false });

      const x = useTransform(baseX, (v) => `${wrap(-20, -45, v)}%`);

      const directionFactor = React.useRef(1);

      useAnimationFrame((t, delta) => {
        let moveBy = directionFactor.current * 5 * (delta / 1000);

        if (velocityFactor.get() < 0) {
          directionFactor.current = -1;
        } else if (velocityFactor.get() > 0) {
          directionFactor.current = 1;
        }

        moveBy += directionFactor.current * moveBy * velocityFactor.get();
        baseX.set(baseX.get() + moveBy);
      });

      function wrap(min, max, v) {
        const rangeSize = max - min;
        return ((((v - min) % rangeSize) + rangeSize) % rangeSize) + min;
      }

      return (
        <>
          <h2 className="demo-title">Velocity Scroll</h2>
          <p className="demo-subtitle">Text speed responds to scroll velocity. Scroll up and down to see the effect.</p>
          <div className="demo-area demo-scroll" style={{ height: '100vh', overflow: 'auto' }}>
            <div style={{ height: '200vh', paddingTop: '40vh' }}>
              <div style={{ overflow: 'hidden', whiteSpace: 'nowrap' }}>
                <motion.div style={{ x, display: 'flex', gap: 40 }}>

                  ))}

              </div>
            </div>
          </div>
        </>
      );
    }

    // Number Ticker
    function NumberTickerDemo() {
      const [values, setValues] = React.useState([0, 0, 0]);
      const targets = [12847, 99.7, 1250000];
      const labels = ['Active Users', 'Uptime %', 'Revenue'];
      const prefixes = ['', '', '$'];
      const decimals = [0, 1, 0];

      React.useEffect(() => {
        setTimeout(() => setValues(targets), 500);
      }, []);

      function Ticker({ value, decimal = 0, prefix = '' }) {
        const ref = React.useRef(null);
        const motionValue = useMotionValue(0);
        const springValue = useSpring(motionValue, { damping: 60, stiffness: 100 });

        React.useEffect(() => { motionValue.set(value); }, [value]);

        React.useEffect(() => {
          return springValue.on('change', (latest) => {
            if (ref.current) {
              const formatted = decimal > 0
                ? latest.toFixed(decimal)
                : Math.round(latest).toLocaleString();
              ref.current.textContent = prefix + formatted;
            }
          });
        }, [springValue, decimal, prefix]);

        return <span ref={ref}>{prefix}0</span>;
      }

      return (
        <>
          <h2 className="demo-title">Number Ticker</h2>
          <p className="demo-subtitle">Animated counters with spring physics. Numbers smoothly animate to target values.</p>
          <div className="demo-area">
            <div style={{ display: 'flex', gap: 50 }}>
              {targets.map((target, i) => (
                <div key={i} style={{ textAlign: 'center' }}>
                  <div style={{
                    fontSize: '3rem',
                    fontWeight: 800,
                    background: 'linear-gradient(135deg, #667eea, #764ba2)',
                    WebkitBackgroundClip: 'text',
                    WebkitTextFillColor: 'transparent'
                  }}>
                    <Ticker value={values[i]} decimal={decimals[i]} prefix={prefixes[i]} />
                  </div>
                  <div style={{ color: '#666', fontSize: '0.9rem', marginTop: 8 }}>{labels[i]}</div>
                </div>
              ))}
            </div>
            <button className="replay-btn" style={{ marginTop: 30 }} onClick={() => { setValues([0,0,0]); setTimeout(() => setValues(targets), 100); }}>Replay</button>
          </div>
        </>
      );
    }

    // Fireworks
    function FireworksDemo() {
      const [explosions, setExplosions] = React.useState([]);
      const [rockets, setRockets] = React.useState([]);

      const colorSchemes = [
        ['#ff4444', '#ff8844', '#ffcc44'],
        ['#44ff44', '#44ffaa', '#aaffaa'],
        ['#4488ff', '#44ccff', '#aaddff'],
        ['#ff44ff', '#ff88ff', '#ffaaff'],
        ['#ffff44', '#ffcc44', '#ff8844'],
        ['#ff4488', '#ff44cc', '#cc44ff']
      ];

      const createExplosion = (x, y) => {
        const id = Date.now() + Math.random();
        const colors = colorSchemes[Math.floor(Math.random() * colorSchemes.length)];
        const numRings = 2 + Math.floor(Math.random() * 2);
        const particles = [];

        for (let ring = 0; ring < numRings; ring++) {
          const numParticles = 20 + ring * 10;
          const baseDistance = 40 + ring * 40;
          for (let i = 0; i < numParticles; i++) {
            particles.push({
              id: `${ring}-${i}`,
              angle: (i / numParticles) * 360 + Math.random() * 10,
              distance: baseDistance + Math.random() * 30,
              color: colors[Math.floor(Math.random() * colors.length)],
              size: 3 + Math.random() * 3,
              duration: 0.8 + ring * 0.3 + Math.random() * 0.3,
              delay: ring * 0.05
            });
          }
        }

        // Add sparkle particles
        for (let i = 0; i < 15; i++) {
          particles.push({
            id: `sparkle-${i}`,
            angle: Math.random() * 360,
            distance: 20 + Math.random() * 100,
            color: '#ffffff',
            size: 2,
            duration: 1.2 + Math.random() * 0.5,
            delay: 0.1,
            isSparkle: true
          });
        }

        setExplosions(prev => [...prev, { id, x, y, particles }]);
        setTimeout(() => setExplosions(prev => prev.filter(e => e.id !== id)), 2000);
      };

      const launchRocket = (x) => {
        const id = Date.now() + Math.random();
        const startY = 350;
        const endY = 50 + Math.random() * 100;

        setRockets(prev => [...prev, { id, x, startY, endY }]);

        setTimeout(() => {
          createExplosion(x, endY);
          setRockets(prev => prev.filter(r => r.id !== id));
        }, 600);
      };

      return (
        <>
          <h2 className="demo-title">Fireworks</h2>
          <p className="demo-subtitle">Click anywhere to launch fireworks with multi-ring explosions and sparkle trails.</p>
          <div className="demo-area">

              onClick={(e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                launchRocket(e.clientX - rect.left);

                borderRadius: 20,

              }}

              {/* City silhouette */}

              </svg>

              <div style={{ position: 'absolute', bottom: 70, left: '50%', transform: 'translateX(-50%)', color: '#444', fontSize: '0.8rem' }}>

      const [rotation, setRotation] = React.useState(0);
      const [isPaused, setIsPaused] = React.useState(false);
      const numPairs = 24;
      const radius = 70;
      const verticalSpacing = 14;

      React.useEffect(() => {
        if (isPaused) return;
        let animationId;
        const animate = () => {
          setRotation(r => (r + 1.5) % 360);
          animationId = requestAnimationFrame(animate);
        };
        animationId = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animationId);
      }, [isPaused]);

      const basePairs = [
        { a: '#00d4ff', b: '#ff00aa', label: 'A-T' },
        { a: '#00ff88', b: '#ffaa00', label: 'G-C' },
        { a: '#aa88ff', b: '#ff6644', label: 'C-G' },
        { a: '#88ffcc', b: '#ff4488', label: 'T-A' }
      ];

      return (
        <>
          <h2 className="demo-title">DNA Helix</h2>
          <p className="demo-subtitle">Interactive 3D double helix with base pair connections and depth shading.</p>
          <div className="demo-area">
            <div
              onClick={() => setIsPaused(!isPaused)}
              style={{
                width: 300,
                height: 400,
                position: 'relative',
                perspective: 1000,
                cursor: 'pointer',
                background: 'radial-gradient(ellipse at center, #1a1a35 0%, #0a0a15 100%)',
                borderRadius: 20,
                overflow: 'hidden'
              }}
            >
              {/* Glow background */}
              <div style={{
                position: 'absolute',
                inset: 0,
                background: 'radial-gradient(ellipse at 50% 50%, rgba(0, 150, 255, 0.1) 0%, transparent 60%)',
                pointerEvents: 'none'
              }} />

              <div style={{
                position: 'absolute',
                left: '50%',
                top: '50%',
                transformStyle: 'preserve-3d'
              }}>
                {[...Array(numPairs)].map((_, i) => {
                  const angle = (i / numPairs) * 720 + rotation;
                  const rad = angle * Math.PI / 180;
                  const x1 = Math.sin(rad) * radius;
                  const z1 = Math.cos(rad) * radius;
                  const x2 = -x1;
                  const z2 = -z1;
                  const y = i * verticalSpacing - (numPairs * verticalSpacing) / 2;

                  const depthFactor1 = (z1 + radius) / (radius * 2);
                  const depthFactor2 = (z2 + radius) / (radius * 2);
                  const size1 = 10 + depthFactor1 * 8;
                  const size2 = 10 + depthFactor2 * 8;
                  const opacity1 = 0.4 + depthFactor1 * 0.6;
                  const opacity2 = 0.4 + depthFactor2 * 0.6;

                  const pair = basePairs[i % basePairs.length];

                  return (
                    <React.Fragment key={i}>
                      {/* Backbone strand 1 */}
                      <div
                        style={{
                          position: 'absolute',
                          width: size1,
                          height: size1,
                          borderRadius: '50%',
                          background: `radial-gradient(circle at 30% 30%, ${pair.a}, ${pair.a}88)`,
                          transform: `translate3d(${x1 - size1/2}px, ${y}px, ${z1}px)`,
                          boxShadow: `0 0 ${10 + depthFactor1 * 15}px ${pair.a}66, inset 0 0 10px rgba(255,255,255,0.3)`,
                          opacity: opacity1,
                          zIndex: Math.round(z1)
                        }}
                      />
                      {/* Backbone strand 2 */}
                      <div
                        style={{
                          position: 'absolute',
                          width: size2,
                          height: size2,
                          borderRadius: '50%',
                          background: `radial-gradient(circle at 30% 30%, ${pair.b}, ${pair.b}88)`,
                          transform: `translate3d(${x2 - size2/2}px, ${y}px, ${z2}px)`,
                          boxShadow: `0 0 ${10 + depthFactor2 * 15}px ${pair.b}66, inset 0 0 10px rgba(255,255,255,0.3)`,
                          opacity: opacity2,
                          zIndex: Math.round(z2)
                        }}
                      />
                      {/* Base pair connection */}
                      <div
                        style={{
                          position: 'absolute',
                          height: 3,
                          width: Math.abs(x1 * 2),
                          background: `linear-gradient(90deg, ${pair.a}aa, #ffffff33, ${pair.b}aa)`,
                          transform: `translate3d(${-Math.abs(x1)}px, ${y}px, ${(z1 + z2) / 2}px)`,
                          opacity: Math.min(opacity1, opacity2) * 0.7,
                          borderRadius: 2,
                          zIndex: Math.round((z1 + z2) / 2) - 1
                        }}
                      />
                    </React.Fragment>
                  );
                })}
              </div>

              {/* Instructions */}
              <div style={{
                position: 'absolute',
                bottom: 15,
                left: '50%',
                transform: 'translateX(-50%)',
                color: '#555',
                fontSize: '0.75rem'
              }}>
                Click to {isPaused ? 'resume' : 'pause'}
              </div>
            </div>
          </div>
        </>
      );
    }

    // Lightning
    function LightningDemo() {
      const [flash, setFlash] = React.useState(0);
      const [bolts, setBolts] = React.useState([]);

      const generateBolt = (startX, startY, endY, maxBranches = 3) => {
        const points = [[startX, startY]];
        let x = startX, y = startY;
        const branches = [];

        while (y < endY) {
          const dx = (Math.random() - 0.5) * 60;
          x += dx;
          y += 15 + Math.random() * 25;
          x = Math.max(50, Math.min(550, x));
          points.push([x, Math.min(y, endY)]);

          if (maxBranches > 0 && Math.random() > 0.7 && y < endY - 50) {
            const branchEndY = y + 40 + Math.random() * 60;
            const branchX = x + (Math.random() > 0.5 ? 1 : -1) * (30 + Math.random() * 50);
            branches.push(generateBolt(x, y, branchEndY, 0));
          }
        }
        return { points, branches };
      };

      const strike = () => {
        const startX = 150 + Math.random() * 300;
        const mainBolt = generateBolt(startX, 0, 350, 3);
        setBolts([mainBolt]);
        setFlash(1);
        setTimeout(() => setFlash(0.3), 50);
        setTimeout(() => setFlash(0.8), 80);
        setTimeout(() => setFlash(0), 150);
        setTimeout(() => setBolts([]), 400);
      };

      React.useEffect(() => {
        const interval = setInterval(strike, 2500 + Math.random() * 2000);
        strike();
        return () => clearInterval(interval);
      }, []);

      const renderBolt = (bolt, key = 'main', opacity = 1) => (
        <React.Fragment key={key}>
          {/* Outer glow */}
          <polyline
            points={bolt.points.map(p => p.join(',')).join(' ')}
            fill="none"
            stroke="rgba(100, 150, 255, 0.3)"
            strokeWidth="20"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
          {/* Middle glow */}
          <polyline
            points={bolt.points.map(p => p.join(',')).join(' ')}
            fill="none"
            stroke="rgba(150, 180, 255, 0.6)"
            strokeWidth="8"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
          {/* Core */}
          <polyline
            points={bolt.points.map(p => p.join(',')).join(' ')}
            fill="none"
            stroke="#fff"
            strokeWidth="3"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
          {bolt.branches.map((branch, i) => renderBolt(branch, `${key}-branch-${i}`, 0.7))}
        </React.Fragment>
      );

      return (
        <>
          <h2 className="demo-title">Lightning</h2>
          <p className="demo-subtitle">Realistic storm with branching bolts, thunder flash, and dramatic clouds.</p>
          <div className="demo-area">
            <motion.div
              style={{
                width: 600,
                height: 350,
                borderRadius: 20,
                position: 'relative',
                overflow: 'hidden'
              }}
            >
              {/* Sky gradient */}
              <motion.div
                style={{
                  position: 'absolute',
                  inset: 0,
                  background: 'linear-gradient(to bottom, #1a1a35 0%, #252545 40%, #151530 100%)'
                }}
                animate={{
                  background: flash > 0
                    ? `linear-gradient(to bottom, rgba(100,120,180,${flash * 0.5}) 0%, rgba(80,100,150,${flash * 0.4}) 40%, rgba(60,80,120,${flash * 0.3}) 100%)`
                    : 'linear-gradient(to bottom, #1a1a35 0%, #252545 40%, #151530 100%)'
                }}
                transition={{ duration: 0.05 }}
              />

              {/* Storm clouds */}
              <motion.div
                style={{
                  position: 'absolute',
                  top: -20,
                  left: -50,
                  right: -50,
                  height: 120,
                  background: 'radial-gradient(ellipse at 30% 100%, #2a2a45 0%, transparent 50%), radial-gradient(ellipse at 70% 100%, #252540 0%, transparent 50%), radial-gradient(ellipse at 50% 100%, #1a1a35 0%, transparent 60%)',
                  filter: 'blur(10px)'
                }}
                animate={{

                    ? 'radial-gradient(ellipse at 30% 100%, #4a4a65 0%, transparent 50%), radial-gradient(ellipse at 70% 100%, #454560 0%, transparent 50%), radial-gradient(ellipse at 50% 100%, #3a3a55 0%, transparent 60%)'
                    : 'radial-gradient(ellipse at 30% 100%, #2a2a45 0%, transparent 50%), radial-gradient(ellipse at 70% 100%, #252540 0%, transparent 50%), radial-gradient(ellipse at 50% 100%, #1a1a35 0%, transparent 60%)'
                }}
              />

              {/* Rain */}
              {[...Array(50)].map((_, i) => (
                <motion.div
                  key={i}

                    position: 'absolute',

    // Vortex
    function VortexDemo() {
      const [speed, setSpeed] = React.useState(1);

      // Create multiple particle rings with varying properties
      const rings = React.useMemo(() => {
        const result = [];
        for (let ring = 0; ring < 8; ring++) {
          const baseDistance = 30 + ring * 25;
          const numParticles = 8 + ring * 4;
          const baseSpeed = 2 + ring * 0.5;
          const direction = ring % 2 === 0 ? 1 : -1;
          const hueStart = 180 + ring * 20;

          for (let i = 0; i < numParticles; i++) {
            const angle = (i / numParticles) * 360;
            result.push({
              ring,
              distance: baseDistance + Math.random() * 10,
              startAngle: angle,
              speed: baseSpeed + Math.random() * 0.5,
              direction,
              size: 2 + (7 - ring) * 0.5 + Math.random() * 2,
              hue: hueStart + (i / numParticles) * 40,
              opacity: 0.4 + (ring / 8) * 0.6
            });
          }
        }
        return result;
      }, []);

      // Spiral arms
      const spiralArms = React.useMemo(() =>
        [...Array(4)].map((_, i) => ({
          angle: i * 90,
          color: `hsl(${200 + i * 30}, 70%, 50%)`
        })), []
      );

      return (
        <>
          <h2 className="demo-title">Vortex</h2>
          <p className="demo-subtitle">Hypnotic spiral galaxy with counter-rotating particle rings. Hover to accelerate.</p>
          <div className="demo-area">
            <div
              onMouseEnter={() => setSpeed(3)}
              onMouseLeave={() => setSpeed(1)}
              style={{
                width: 420,
                height: 420,
                borderRadius: '50%',
                background: 'radial-gradient(circle, #15102a 0%, #0a0815 50%, #050510 100%)',
                position: 'relative',
                overflow: 'hidden',
                cursor: 'pointer',
                boxShadow: 'inset 0 0 100px rgba(100, 150, 255, 0.1)'
              }}
            >
              {/* Spiral arms */}
              {spiralArms.map((arm, i) => (
                <motion.div
                  key={`arm-${i}`}
                  style={{
                    position: 'absolute',
                    left: '50%',
                    top: '50%',
                    width: 200,
                    height: 4,
                    background: `linear-gradient(90deg, ${arm.color}00, ${arm.color}44, ${arm.color}00)`,
                    transformOrigin: 'left center',
                    filter: 'blur(8px)'
                  }}
                  animate={{ rotate: [arm.angle, arm.angle + 360] }}
                  transition={{ duration: 20 / speed, repeat: Infinity, ease: 'linear' }}
                />
              ))}

              {/* Background glow rings */}
              {[1, 2, 3].map(i => (
                <motion.div
                  key={`glow-${i}`}
                  style={{
                    position: 'absolute',
                    left: '50%',
                    top: '50%',
                    width: 60 + i * 80,
                    height: 60 + i * 80,
                    marginLeft: -(30 + i * 40),
                    marginTop: -(30 + i * 40),
                    border: `1px solid rgba(100, 150, 255, ${0.15 - i * 0.03})`,
                    borderRadius: '50%'
                  }}
                  animate={{ rotate: 360 * (i % 2 === 0 ? 1 : -1) }}
                  transition={{ duration: (15 + i * 5) / speed, repeat: Infinity, ease: 'linear' }}
                />
              ))}

              {/* Particles */}
              {rings.map((p, i) => (
                <motion.div
                  key={i}
                  style={{
                    position: 'absolute',
                    left: '50%',
                    top: '50%',
                    width: p.size,
                    height: p.size,
                    marginLeft: -p.size / 2,
                    marginTop: -p.size / 2,
                    borderRadius: '50%',
                    background: `hsl(${p.hue}, 70%, 60%)`,
                    boxShadow: `0 0 ${p.size * 2}px hsl(${p.hue}, 70%, 60%)`,
                    opacity: p.opacity
                  }}
                  animate={{ rotate: 360 * p.direction }}
                  transition={{
                    duration: p.speed / speed,
                    repeat: Infinity,
                    ease: 'linear'
                  }}
                  initial={{
                    x: Math.cos(p.startAngle * Math.PI / 180) * p.distance,
                    y: Math.sin(p.startAngle * Math.PI / 180) * p.distance
                  }}
                />
              ))}

              {/* Center singularity */}
              <motion.div
                style={{
                  position: 'absolute',
                  left: '50%',
                  top: '50%',
                  transform: 'translate(-50%, -50%)',
                  width: 30,
                  height: 30,
                  borderRadius: '50%',
                  background: 'radial-gradient(circle, #fff 0%, #aaccff 30%, #4488ff 60%, transparent 100%)',
                  boxShadow: '0 0 30px #fff, 0 0 60px #88aaff, 0 0 100px #4488ff'
                }}
                animate={{ scale: [1, 1.1, 1] }}
                transition={{ duration: 2 / speed, repeat: Infinity, ease: 'easeInOut' }}
              />

              {/* Inner glow */}
              <div style={{
                position: 'absolute',
                left: '50%',
                top: '50%',
                transform: 'translate(-50%, -50%)',
                width: 100,
                height: 100,

                pointerEvents: 'none'
              }} />
            </div>
          </div>
        </>

        React.useEffect(() => {

          return () => clearTimeout(timer);
        }, [value, delay, key]);

        React.useEffect(() => {
          return springValue.on('change', (latest) => {
            setDisplay(value >= 100 ? Math.round(latest) : Math.round(latest * 10) / 10);
          });
        }, [springValue, value]);

        return <span>{display.toLocaleString()}{suffix}</span>;

    function HeroInteractiveDemo() {
      const containerRef = React.useRef(null);
      const mouseX = useMotionValue(0);
      const mouseY = useMotionValue(0);
      const smoothX = useSpring(mouseX, { stiffness: 50, damping: 20 });
      const smoothY = useSpring(mouseY, { stiffness: 50, damping: 20 });

      const handleMouseMove = (e) => {
        const rect = containerRef.current.getBoundingClientRect();
        mouseX.set((e.clientX - rect.left) / rect.width - 0.5);
        mouseY.set((e.clientY - rect.top) / rect.height - 0.5);
      };

      const textX = useTransform(smoothX, [-0.5, 0.5], [-30, 30]);
      const textY = useTransform(smoothY, [-0.5, 0.5], [-30, 30]);
      const glowX = useTransform(mouseX, [-0.5, 0.5], ['20%', '80%']);
      const glowY = useTransform(mouseY, [-0.5, 0.5], ['20%', '80%']);
      const gradientAngle = useTransform(mouseX, [-0.5, 0.5], [0, 360]);

      // Generate floating particles
      const particles = React.useMemo(() =>
        [...Array(30)].map((_, i) => ({
          x: Math.random() * 100,
          y: Math.random() * 100,
          size: 2 + Math.random() * 4,
          depth: 0.3 + Math.random() * 0.7
        })), []);

      return (
        <>
          <h2 className="demo-title">Hero Interactive</h2>
          <p className="demo-subtitle">Fully reactive parallax with particles, glows, and depth layers.</p>

            <div

                }}
              />
              <motion.div
                style={{
                  position: 'absolute',
                  inset: 0,
                  background: useMotionTemplate`radial-gradient(400px circle at ${glowX} ${glowY}, rgba(240, 147, 251, 0.1), transparent 50%)`
                }}
              />

              {/* Grid */}
              <div style={{
                position: 'absolute',
                inset: 0,
                backgroundImage: 'linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px)',
                backgroundSize: '40px 40px'
              }} />

              {/* Floating particles with parallax */}
              {particles.map((particle, i) => {
                const px = useTransform(smoothX, [-0.5, 0.5], [-(30 * particle.depth), (30 * particle.depth)]);
                const py = useTransform(smoothY, [-0.5, 0.5], [-(30 * particle.depth), (30 * particle.depth)]);

                      height: particle.size,
                      borderRadius: '50%',

                      x: px,
                      y: py
                    }}
                  />
                );
              })}

              {/* Concentric rings with parallax */}
              {[...Array(6)].map((_, i) => {
                const depth = (i + 1) / 6;

                          justifyContent: 'center',
                          color: '#fff',
                          fontSize: '1rem'
                        }}>
                          ◆
                        </span>
                        Acme
                      </div>
                      <p style={{ color: '#777', fontSize: '0.9rem', lineHeight: 1.7, marginBottom: 20 }}>
                        Building the future of digital experiences. One pixel at a time.
                      </p>

                      {/* Mini newsletter */}
                      <div style={{
                        display: 'flex',
                        gap: 8,
                        padding: 4,
                        background: 'rgba(255,255,255,0.03)',
                        borderRadius: 10,
                        border: '1px solid rgba(255,255,255,0.06)'
                      }}>
                        <input
                          type="email"
                          placeholder="Email"
                          style={{
                            flex: 1,
                            padding: '10px 14px',
                            border: 'none',
                            background: 'transparent',
                            color: '#fff',
                            outline: 'none',
                            fontSize: '0.85rem'

                        />
                        <motion.button
                          style={{
                            padding: '10px 16px',
                            background: 'linear-gradient(135deg, #667eea, #764ba2)',
                            border: 'none',
                            borderRadius: 8,
                            color: '#fff',
                            cursor: 'pointer',
                            fontSize: '0.85rem'
                          }}
                          whileHover={{ scale: 1.02 }}
                          whileTap={{ scale: 0.98 }}

                          →
                        </motion.button>
                      </div>
                    </motion.div>
                  </div>

                  {/* Link columns */}
                  {sections.map((section, i) => (
                    <motion.div
                      key={i}
                      initial={{ opacity: 0, y: 20 }}
                      animate={{ opacity: 1, y: 0 }}
                      transition={{ delay: 0.1 + i * 0.05 }}
                    >
                      <div style={{
                        fontWeight: 600,
                        marginBottom: 20,
                        fontSize: '0.9rem',
                        color: '#fff',
                        textTransform: 'uppercase',
                        letterSpacing: 1
                      }}>
                        {section.title}
                      </div>
                      {section.links.map((link, j) => (
                        <motion.div
                          key={j}
                          initial={{ opacity: 0, x: -10 }}
                          animate={{ opacity: 1, x: 0 }}
                          transition={{ delay: 0.2 + j * 0.05 }}
                          whileHover={{ x: 5 }}
                          style={{
                            color: '#777',
                            fontSize: '0.9rem',
                            marginBottom: 12,
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            gap: 8
                          }}
                        >
                          <motion.span
                            whileHover={{ color: '#667eea' }}
                            style={{ transition: 'color 0.2s' }}
                          >
                            {link.name}
                          </motion.span>
                          {link.badge && (
                            <span style={{
                              padding: '2px 8px',
                              background: link.badge === 'New' ? 'rgba(0, 255, 136, 0.2)' : 'rgba(102, 126, 234, 0.2)',
                              color: link.badge === 'New' ? '#00ff88' : '#667eea',
                              borderRadius: 10,
                              fontSize: '0.7rem'
                            }}>
                              {link.badge}
                            </span>
                          )}

                      ))}
                    </motion.div>
                  ))}
                </div>
              </div>

              {/* Bottom bar */}
              <div style={{
                padding: '25px 50px',
                background: 'rgba(0,0,0,0.2)',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                flexWrap: 'wrap',
                gap: 20
              }}>
                <motion.span
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  transition={{ delay: 0.3 }}
                  style={{ color: '#555', fontSize: '0.85rem' }}
                >
                  © 2024 Acme Inc. All rights reserved.
                </motion.span>

                {/* Social icons */}
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  transition={{ delay: 0.4 }}
                  style={{ display: 'flex', gap: 12 }}
                >
                  {socials.map((social, i) => (
                    <motion.div
                      key={i}
                      whileHover={{ y: -3, scale: 1.1 }}
                      style={{
                        width: 36,
                        height: 36,
                        borderRadius: 10,
                        background: 'rgba(255,255,255,0.05)',
                        border: '1px solid rgba(255,255,255,0.08)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        cursor: 'pointer',
                        fontSize: '1rem',
                        color: '#888',
                        transition: 'all 0.2s'
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.borderColor = social.color;
                        e.currentTarget.style.color = social.color;
                        e.currentTarget.style.boxShadow = `0 0 20px ${social.color}30`;
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)';
                        e.currentTarget.style.color = '#888';
                        e.currentTarget.style.boxShadow = 'none';
                      }}
                    >
                      {social.icon}
                    </motion.div>
                  ))}
                </motion.div>

                {/* Status indicator */}
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  transition={{ delay: 0.5 }}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: 8,
                    padding: '6px 12px',
                    background: 'rgba(0, 255, 136, 0.1)',
                    borderRadius: 20,
                    border: '1px solid rgba(0, 255, 136, 0.2)'
                  }}
                >
                  <motion.span
                    animate={{ scale: [1, 1.2, 1] }}
                    transition={{ duration: 2, repeat: Infinity }}
                    style={{
                      width: 6,
                      height: 6,
                      borderRadius: '50%',
                      background: '#00ff88',
                      boxShadow: '0 0 10px #00ff88'
                    }}
                  />
                  <span style={{ color: '#00ff88', fontSize: '0.8rem' }}>All systems operational</span>
                </motion.div>
              </div>
            </div>
          </div>
        </>
      );

    // Main App
    function App() {
      const [active, setActive] = React.useState('hover');
      const DemoComponent = demoComponents[active];
      const isScrollDemo = ['parallax', 'heroparallax', 'hscroll', 'scrollprogress', 'velocity'].includes(active);

      return (
        <>
          <nav className="sidebar">
            <h1>Framer Motion</h1>
            {Object.entries(categories).map(([cat, demos]) => (
              <React.Fragment key={cat}>
                <div className="sidebar-section">{cat}</div>
                {demos.map(d => (
                  <button key={d} className={active === d ? 'active' : ''} onClick={() => setActive(d)}>
                    {demoNames[d]}
                  </button>
                ))}
              </React.Fragment>
            ))}
          </nav>

          <div className="main-content">
            {!isScrollDemo && (
              <AnimatePresence mode="wait">
                <motion.div
                  key={active}
                  initial={{ opacity: 0, y: 20 }}
                  animate={{ opacity: 1, y: 0 }}
                  exit={{ opacity: 0, y: -20 }}
                  transition={{ duration: 0.3 }}
                >
                  <DemoComponent />
                </motion.div>
              </AnimatePresence>
            )}
            {isScrollDemo && (
              <>
                <div className="demo-header">
                  <h2 className="demo-title">{demoNames[active]}</h2>
                  <p className="demo-subtitle">
                    {active === 'parallax' && 'Scroll down. Multiple layers move at different speeds.'}
                    {active === 'heroparallax' && 'Scroll down. Advanced parallax with floating cards, color shifts, and scale transforms.'}
                    {active === 'hscroll' && 'Scroll down. Vertical scroll transforms into horizontal card movement.'}
                    {active === 'scrollprogress' && 'Scroll down. Progress bar tracks position. Cards reveal on viewport entry.'}
                    {active === 'velocity' && 'Scroll up and down. Text speed responds to scroll velocity.'}
                  </p>
                </div>
                <DemoComponent />
              </>
            )}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
